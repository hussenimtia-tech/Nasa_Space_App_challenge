<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SpaceSkribble</title>
  <link rel="stylesheet" href="./style.css">
  <style>
/* Shared styles for login.html and register.html (design can be refined later) */
.auth-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;position:relative;isolation:isolate;
  background:radial-gradient(1200px 700px at 85% -10%,rgba(199,125,255,.18),transparent 60%),
  radial-gradient(900px 600px at -10% 30%,rgba(92,225,255,.1),transparent 60%),
  radial-gradient(1000px 800px at 50% 120%,rgba(255,138,61,.12),transparent 60%),#060818;background-attachment:fixed}
.auth-card{width:100%;max-width:440px;padding:clamp(24px,5vw,38px);position:relative;z-index:1;background:rgba(14,18,44,.78);
  border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.auth-brand{text-align:center;margin-bottom:26px}
.auth-brand .brand{display:inline-flex;align-items:center;justify-content:center;gap:12px;color:var(--ink,#f4f1ea);font:800 22px var(--display,system-ui);text-decoration:none}
.auth-brand .brand-mark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-card .eyebrow{text-align:center;margin:0 0 10px;color:var(--ion,#5ce1ff);font-size:11px;font-weight:800;letter-spacing:3px}
.auth-card h1{text-align:center;font-size:clamp(30px,6vw,38px);margin:0 0 10px;color:var(--ink,#f4f1ea)}
.auth-description{text-align:center;color:var(--muted,rgba(244,241,234,.64));margin:0 0 24px;font-size:15px;line-height:1.6}
.auth-form{display:grid;gap:14px}
.auth-form label{display:grid;gap:7px;color:var(--muted,rgba(244,241,234,.64));font-size:14px}
.auth-form input,.auth-form select{box-sizing:border-box;width:100%;min-width:0;padding:13px 15px;color:var(--ink,#f4f1ea);background:rgba(0,0,0,.3);
  border:1px solid var(--line,rgba(255,255,255,.1));border-radius:14px;font:500 15px var(--body,Arial,sans-serif);transition:border-color .2s,box-shadow .2s}
.auth-form input::placeholder{color:rgba(244,241,234,.42)}
.auth-form input:focus,.auth-form select:focus{outline:none;border-color:var(--ion,#5ce1ff);box-shadow:0 0 0 4px rgba(92,225,255,.15)}
.auth-form select option{color:var(--ink,#f4f1ea);background:var(--bg-2,#0b1030)}
.auth-submit{width:100%;min-height:50px;margin-top:6px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--sun-2,#ffd166),var(--sun,#ff8a3d) 55%,#ff5e7e);
  color:#1b0f05;font:700 16px var(--body,Arial,sans-serif);cursor:pointer;box-shadow:0 12px 30px -10px rgba(255,138,61,.55);transition:transform .25s,box-shadow .25s}
.auth-submit:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(255,138,61,.8)}
.auth-submit:disabled{opacity:.6;cursor:wait;transform:none}
.auth-message{min-height:20px;margin:12px 0 0;text-align:center;overflow-wrap:anywhere;color:var(--ion,#5ce1ff);font-size:14px}
.auth-footer{margin:22px 0 0;text-align:center;color:var(--muted,rgba(244,241,234,.64));font-size:14px}
.auth-footer a,.auth-back{color:var(--ion,#5ce1ff);text-decoration:none;transition:color .2s}
.auth-footer a:hover,.auth-back:hover{color:var(--sun-2,#ffd166)}
.auth-back{display:block;margin-top:20px;text-align:center;font-size:14px}
.auth-forgot{justify-self:end;margin-top:-6px;color:var(--ion,#5ce1ff);font-size:13px;text-decoration:none;transition:color .2s}
.auth-forgot:hover{color:var(--sun-2,#ffd166)}
@media (max-width:480px){.auth-screen{padding:16px}.auth-card{padding:24px 20px;border-radius:20px}}
@media (prefers-reduced-motion:reduce){.auth-submit,.auth-form input,.auth-form select{transition:none}}
  </style>
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card">
      <div class="auth-brand">
        <a class="brand" href="./login.html">
          <span class="brand-mark" aria-hidden="true"><span class="ring"></span></span>
          <span>SpaceSkribble</span>
        </a>
      </div>

      <p class="eyebrow">WELCOME BACK, EXPLORER</p>
      <h1>Welcome Back</h1>
      <p class="auth-description">Sign in and continue your cosmic adventure.</p>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email Address
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </label>
        <label for="login-password">Password
          <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </label>
        <a href="#" id="forgot-link" class="auth-forgot">Forgot password?</a>
        <button class="auth-submit" type="submit">Login to SpaceSkribble</button>
      </form>

      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>

      <p class="auth-footer">New player? <a href="./register.html">Create an account</a></p>
    </section>
  </main>
  <script src="./js/config.js"></script>
  <script src="./js/auth.js"></script>
  <script>
  // Forgot password: uses window.requestPasswordReset(email) from auth.js
  (function () {
    var link = document.getElementById('forgot-link');
    var emailInput = document.getElementById('login-email');
    var msg = document.getElementById('auth-message');
    link.addEventListener('click', async function (e) {
      e.preventDefault();
      var email = emailInput.value.trim();
      if (!email) {
        msg.textContent = 'Enter your email address first, then click "Forgot password?".';
        emailInput.focus();
        return;
      }
      if (typeof window.requestPasswordReset !== 'function') {
        msg.textContent = 'Password reset is not connected yet.';
        return;
      }
      msg.textContent = 'Sending reset link...';
      try {
        await window.requestPasswordReset(email);
        msg.textContent = 'If an account exists for this email, a reset link has been sent. Check your inbox and spam folder.';
      } catch (err) {
        msg.textContent = 'Could not send the reset link. Please try again.';
      }
    });
  })();
  </script>
</body>
</html>
